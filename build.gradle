plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}
architectury { minecraft = libs.versions.minecraft.get() }
ext.seamlessApiDirectory = file(providers.gradleProperty('seamlessApiDir').getOrElse('../seamless-api'))
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }
}
subprojects {
    apply plugin: 'java-library'
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(JavaExec).configureEach { javaLauncher=javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(21) }; maxHeapSize='1G'; timeout=java.time.Duration.ofMinutes(4); jvmArgs '-XX:ActiveProcessorCount=2' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
}
tasks.register('verifyCommonIsolation') {
    group = 'verification'
    doLast {
        fileTree('common/src').matching { include '**/*.java' }.each { source ->
            if (source.text =~ /net\.(fabricmc|minecraftforge|neoforged)\./) throw new GradleException("Loader API in ${source}")
        }
    }
}
tasks.register('verifyLoaderJars') {
    dependsOn ':fabric:remapJar',':forge:remapJar',':neoforge:remapJar'
    doLast {
        ['fabric','forge','neoforge'].each { loader ->
            def archive=project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            assert archive.name=="seamless-dogs-${project.version}-${loader}.jar"
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                def metadataPath=loader=='fabric' ? 'fabric.mod.json' : loader=='forge' ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml'
                assert zip.getEntry(metadataPath)!=null
                ['fabric.mod.json','META-INF/mods.toml','META-INF/neoforge.mods.toml'].findAll { it!=metadataPath }.each { assert zip.getEntry(it)==null }
                ['seamlessdogs.mixins.json','seamlessdogs.refmap.json','LICENSE','assets/seamlessdogs/icon.png','io/github/derkottersberg/seamlessdogs/SeamlessDogs.class'].each { assert zip.getEntry(it)!=null }
                zip.entries().each { entry ->
                    assert !entry.name.startsWith('com/derko/seamlessapi/') && !entry.name.contains('/gametest/') && !entry.name.contains('/qa/')
                    if(entry.name.endsWith('.class')) {
                        def stream=new DataInputStream(zip.getInputStream(entry)); assert stream.readInt()==0xCAFEBABE as int; stream.readUnsignedShort(); assert stream.readUnsignedShort()==65; stream.close()
                    }
                }
                if(loader=='fabric') {
                    def metadata=new groovy.json.JsonSlurper().parseText(zip.getInputStream(zip.getEntry('fabric.mod.json')).getText('UTF-8'))
            def entrypointBytes=zip.getInputStream(zip.getEntry('io/github/derkottersberg/seamlessdogs/fabric/DogsFabric.class')).bytes
            assert !new String(entrypointBytes,java.nio.charset.StandardCharsets.ISO_8859_1).contains('net/minecraft/world/entity/Entity') : 'Fabric runtime jar contains development Minecraft names'
                    assert metadata.id=='seamlessdogs' && metadata.version==project.version.toString() && metadata.depends.minecraft=='1.21.1' && metadata.depends.java=='>=21'
                    assert metadata.license=='All rights reserved' && metadata.depends.seamlessapi=='>=2.0.2 <3.0.0'
                    assert metadata.depends['fabric-api']=='>=0.116.17 <0.117.0'
                } else {
                    def text=zip.getInputStream(zip.getEntry(metadataPath)).getText('UTF-8')
                    assert text.contains('versionRange="[1.21.1]"') && text.contains('modId="seamlessapi"') && !text.contains('${')
                    assert text.contains('license="All rights reserved"') && text.contains('javaVersion="[21,)"') && text.contains('versionRange="[2.0.2,3.0.0)"')
                    assert text.contains(loader=='forge' ? 'versionRange="[52.1.16,53)"' : 'versionRange="[21.1.255,21.2)"')
                }
            }
        }
    }
}
tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') { dependsOn 'verifyCommonIsolation', 'verifyLoaderJars'; dependsOn subprojects.collect { it.tasks.named('check') } }
