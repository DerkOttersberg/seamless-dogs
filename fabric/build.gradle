plugins { id 'dev.architectury.loom' }
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modCompileOnly libs.modmenu
    def apiJar=files(new File(rootProject.seamlessApiDirectory,"fabric/build/devlibs/seamless-api-${libs.versions.seamless.api.get()}-fabric-dev.jar"))
    apiJar.builtBy gradle.includedBuild('seamless-api').task(':fabric:jar')
    implementation apiJar
}
loom {
    mixin { useLegacyMixinAp=true; defaultRefmapName='seamlessdogs.refmap.json' }
    mods { seamlessdogs { sourceSet sourceSets.main } }
}
fabricApi { configureTests { createSourceSet=true; modId='seamlessdogs-gametest'; enableGameTests=true; enableClientGameTests=false; eula=true } }
sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
tasks.named('runGameTest') { doLast {
    def log=layout.buildDirectory.file('run/gameTest/logs/latest.log').get().asFile.text
    ['ownerCanPet', 'rejectInvalidRequests', 'cooldownAndCancellation', 'codecRoundTrip'].each { name -> if(!log.contains("DOGS_GAMETEST_PASS ${name}")) throw new GradleException("Missing/failed scenario ${name}") }
    if(!(log =~ /All 4 required tests passed/)) throw new GradleException('Incomplete native tests')
} }
tasks.named('check') { dependsOn 'runGameTest' }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
tasks.named('jar',Jar) {
    from rootProject.file('LICENSE'); duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    manifest { attributes 'MixinConfigs':'seamlessdogs.mixins.json' }
    archiveFileName="seamless-dogs-${project.version}-fabric-dev.jar"
}
tasks.named('sourcesJar',Jar) { from project(':common').sourceSets.main.allSource; duplicatesStrategy=DuplicatesStrategy.EXCLUDE }
tasks.named('remapJar') { archiveFileName="seamless-dogs-${project.version}-fabric.jar" }
tasks.named('remapSourcesJar') { archiveFileName="seamless-dogs-${project.version}-fabric-sources.jar" }
