plugins { id 'dev.architectury.loom-no-remap' }
dependencies {
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    compileOnly libs.modmenu
    implementation project(':common')
}
loom { mods { seamlessdogs { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } } }
fabricApi { configureTests { createSourceSet = true; modId = 'seamlessdogs-gametest'; enableGameTests = true; enableClientGameTests = false; eula = true } }
dependencies { gametestImplementation project(':common') }
sourceSets.gametest.java.srcDir rootProject.file('common/src/gametest/java')
tasks.named('runGameTest') {
    doLast {
        def log = layout.buildDirectory.file('run/gameTest/logs/latest.log').get().asFile.text
        ['ownerCanPet', 'rejectInvalidRequests', 'cooldownAndCancellation', 'codecRoundTrip', 'catOwnership', 'diggingTerrain', 'v2CodecRoundTrip', 'idleContracts'].each { name ->
            if (!log.contains("DOGS_GAMETEST_PASS ${name}")) throw new GradleException("Undiscovered or failed dog test ${name}")
        }
        if (!(log =~ /All 9 required tests passed/)) throw new GradleException('Dog GameTests did not pass')
    }
}
tasks.named('check') { dependsOn 'runGameTest' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.named('jar', Jar) {
    from project(':common').sourceSets.main.output
    from rootProject.file('LICENSE')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "seamless-dogs-${project.version}-fabric.jar"
}
tasks.named('sourcesJar', Jar) { from project(':common').sourceSets.main.allSource; archiveFileName = "seamless-dogs-${project.version}-fabric-sources.jar" }

repositories { maven { url = "https://api.modrinth.com/maven" }; maven { url = "https://maven.nucleoid.xyz/" } }
dependencies { compileOnly("maven.modrinth:open-parties-and-claims:fabric-26.3-0.32.8") { transitive = false } }
dependencies { compileOnly("eu.pb4:common-protection-api:2.0.0") { transitive = false } }

sourceSets.gametest.resources.srcDir rootProject.file('common/src/gametest/resources')
