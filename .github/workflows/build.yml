name: Build all loaders 1.20.1
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-dogs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: chmod +x gradlew && ./gradlew clean check build --no-daemon
        working-directory: seamless-dogs
      - uses: actions/upload-artifact@v4
        with:
          name: seamless-dogs-all-loaders-1.20.1
          path: |
            seamless-dogs/fabric/build/libs/*-fabric.jar
            seamless-dogs/forge/build/libs/*-forge.jar
