name: Build all loaders 1.21.1
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-dogs
      - uses: actions/checkout@v4
        with:
          repository: DerkOttersberg/seamless-api
          ref: 6bb9de09ed9e01c1b7614149e6eb2e5e461d367e
          path: seamless-api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: chmod +x gradlew && ./gradlew clean check build --no-daemon
        working-directory: seamless-api
      - run: chmod +x gradlew && ./gradlew clean check build -PseamlessApiDir=../seamless-api --no-daemon
        working-directory: seamless-dogs
      - uses: actions/upload-artifact@v4
        with:
          name: seamless-dogs-all-loaders-1.21.1
          path: |
            seamless-dogs/fabric/build/libs/*-fabric.jar
            seamless-api/fabric/build/libs/*-fabric.jar
            seamless-dogs/forge/build/libs/*-forge.jar
            seamless-api/forge/build/libs/*-forge.jar
            seamless-dogs/neoforge/build/libs/*-neoforge.jar
            seamless-api/neoforge/build/libs/*-neoforge.jar
